<?xml version="1.0" encoding="UTF-8"?>
<!--
  Book of Mormon Tree of Life  SLAB form mockup (front elevation).
  Landscape plaque: path + iron rod lead to the tree; fruit = LED points.
  Print or open in a browser; use as a wire-bend / pour-layout guide.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" role="img" aria-labelledby="title desc">
  <title id="title">Tree of Life slab mockup</title>
  <desc id="desc">Rectangular clear-epoxy slab with copper wire Tree of Life, glowing fruit LEDs, iron rod, and path from Lehi's dream.</desc>
  <defs>
    <linearGradient id="slabGlass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f4ff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#b8d4e8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7aa3c4" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1220"/>
      <stop offset="100%" stop-color="#1a2740"/>
    </linearGradient>
    <radialGradient id="fruitGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7" stop-opacity="1"/>
      <stop offset="40%" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffd060" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fruitBloom" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Stage / desk shadow -->
  <ellipse cx="400" cy="448" rx="280" ry="14" fill="#000" opacity="0.35"/>

  <!-- Epoxy slab body (perspective-ish rectangle) -->
  <g id="slab">
    <!-- Back face hint -->
    <path d="M70 70 L730 70 L710 400 L90 400 Z" fill="#152033" stroke="#3d5a80" stroke-width="2"/>
    <!-- Glass fill -->
    <path d="M70 70 L730 70 L710 400 L90 400 Z" fill="url(#slabGlass)"/>
    <!-- Edge bevel -->
    <path d="M70 70 L730 70 L722 86 L78 86 Z" fill="#cfe6f7" opacity="0.35"/>
    <path d="M710 400 L730 70 L722 86 L702 392 Z" fill="#2a4060" opacity="0.45"/>
    <path d="M90 400 L710 400 L702 392 L98 392 Z" fill="#1e3048" opacity="0.5"/>
  </g>

  <!-- Scene inside slab -->
  <g id="scene" transform="translate(0,8)">
    <!-- Mist of darkness (subtle) -->
    <ellipse cx="280" cy="220" rx="120" ry="70" fill="#6b7a99" opacity="0.12"/>
    <ellipse cx="340" cy="200" rx="90" ry="50" fill="#8a96b0" opacity="0.1"/>

    <!-- Filthy river (left/bottom band) -->
    <path d="M100 330 C180 300 260 350 340 320 C400 300 420 340 480 330 L480 380 L100 380 Z"
          fill="#2a3540" opacity="0.55"/>
    <path d="M110 340 C200 315 250 355 330 335" fill="none" stroke="#3d4d5c" stroke-width="2" opacity="0.6"/>

    <!-- Strait and narrow path -->
    <path d="M120 360 L420 300 L455 305 L155 365 Z" fill="#5c4a32" opacity="0.55"/>
    <path d="M130 355 L430 298" fill="none" stroke="#8a7355" stroke-width="1.5" opacity="0.7"/>

    <!-- Iron rod (word of God)  metallic line beside path -->
    <line x1="140" y1="348" x2="445" y2="292" stroke="#a8b4c4" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="140" y1="348" x2="445" y2="292" stroke="#e8eef5" stroke-width="1.2" stroke-linecap="round" opacity="0.85"/>
    <!-- Rod posts -->
    <g fill="#9aa8b8">
      <rect x="168" y="330" width="3" height="22" rx="1"/>
      <rect x="248" y="318" width="3" height="22" rx="1"/>
      <rect x="328" y="306" width="3" height="22" rx="1"/>
      <rect x="400" y="296" width="3" height="20" rx="1"/>
    </g>

    <!-- Great & spacious building (distant silhouette, optional narrative) -->
    <g opacity="0.35" fill="#4a5568">
      <rect x="130" y="120" width="70" height="90"/>
      <rect x="145" y="95" width="18" height="25"/>
      <rect x="170" y="105" width="14" height="15"/>
      <rect x="155" y="140" width="10" height="12" fill="#0b1220" opacity="0.5"/>
      <rect x="175" y="155" width="10" height="12" fill="#0b1220" opacity="0.5"/>
    </g>

    <!-- Copper wire Tree of Life -->
    <g id="tree" filter="url(#softGlow)">
      <!-- Roots into "ground" of resin -->
      <path d="M470 355 Q455 375 440 385" fill="none" stroke="#b87333" stroke-width="2.2"/>
      <path d="M490 355 Q505 378 520 388" fill="none" stroke="#b87333" stroke-width="2.2"/>
      <path d="M480 355 Q480 380 475 395" fill="none" stroke="#c68642" stroke-width="2.5"/>
      <!-- Trunk -->
      <path d="M480 355 C478 300 470 250 465 200" fill="none" stroke="#c68642" stroke-width="5" stroke-linecap="round"/>
      <path d="M480 355 C482 300 488 255 500 210" fill="none" stroke="#b87333" stroke-width="3.5" stroke-linecap="round"/>
      <!-- Branches -->
      <path d="M465 210 C430 180 400 160 375 145" fill="none" stroke="#c68642" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M470 230 C440 210 420 190 400 175" fill="none" stroke="#b87333" stroke-width="2.2"/>
      <path d="M500 215 C540 185 580 165 610 150" fill="none" stroke="#c68642" stroke-width="2.8" stroke-linecap="round"/>
      <path d="M495 240 C530 220 560 200 585 185" fill="none" stroke="#b87333" stroke-width="2.2"/>
      <path d="M468 185 C450 150 440 120 435 95" fill="none" stroke="#c68642" stroke-width="2.5"/>
      <path d="M498 195 C520 160 545 130 560 105" fill="none" stroke="#c68642" stroke-width="2.5"/>
      <path d="M480 175 C485 140 490 110 492 88" fill="none" stroke="#d4a05a" stroke-width="2"/>
      <!-- Twigs -->
      <path d="M390 155 C375 148 360 150 350 155" fill="none" stroke="#b87333" stroke-width="1.5"/>
      <path d="M595 160 C610 152 625 155 635 162" fill="none" stroke="#b87333" stroke-width="1.5"/>
      <path d="M445 115 C430 100 425 90 420 82" fill="none" stroke="#b87333" stroke-width="1.4"/>
      <path d="M545 120 C560 105 575 98 585 90" fill="none" stroke="#b87333" stroke-width="1.4"/>
    </g>

    <!-- White fruit = LED points (love of God / Atonement symbolism) -->
    <g id="fruit" filter="url(#fruitBloom)">
      <circle cx="375" cy="145" r="14" fill="url(#fruitGlow)"/>
      <circle cx="375" cy="145" r="4.5" fill="#fffef5"/>
      <circle cx="400" cy="175" r="12" fill="url(#fruitGlow)"/>
      <circle cx="400" cy="175" r="3.8" fill="#fffef5"/>
      <circle cx="435" cy="95" r="13" fill="url(#fruitGlow)"/>
      <circle cx="435" cy="95" r="4.2" fill="#fffef5"/>
      <circle cx="492" cy="88" r="15" fill="url(#fruitGlow)"/>
      <circle cx="492" cy="88" r="5" fill="#fffef5"/>
      <circle cx="560" cy="105" r="13" fill="url(#fruitGlow)"/>
      <circle cx="560" cy="105" r="4.2" fill="#fffef5"/>
      <circle cx="610" cy="150" r="14" fill="url(#fruitGlow)"/>
      <circle cx="610" cy="150" r="4.5" fill="#fffef5"/>
      <circle cx="585" cy="185" r="11" fill="url(#fruitGlow)"/>
      <circle cx="585" cy="185" r="3.5" fill="#fffef5"/>
      <circle cx="350" cy="155" r="10" fill="url(#fruitGlow)"/>
      <circle cx="350" cy="155" r="3.2" fill="#fffef5"/>
      <circle cx="635" cy="162" r="10" fill="url(#fruitGlow)"/>
      <circle cx="635" cy="162" r="3.2" fill="#fffef5"/>
    </g>

    <!-- Living waters fountain hint at tree base -->
    <ellipse cx="480" cy="350" rx="28" ry="8" fill="#7ec8e3" opacity="0.35"/>
    <ellipse cx="480" cy="348" rx="16" ry="4" fill="#b8e8f5" opacity="0.4"/>
  </g>

  <!-- Labels (mockup annotations  not cast into resin) -->
  <g font-family="Georgia, serif" fill="#c9d4e0" font-size="12">
    <text x="400" y="36" text-anchor="middle" font-size="18" fill="#7ee787">Form A  Slab / plaque (landscape)</text>
    <text x="400" y="54" text-anchor="middle" font-size="11" fill="#8b9aab">Clear epoxy � copper wire tree � LEDs as white fruit � iron rod + path</text>
    <text x="200" y="420" font-size="10" fill="#8b9aab">iron rod �</text>
    <text x="520" y="420" font-size="10" fill="#8b9aab">� tree of life + fruit (LEDs)</text>
  </g>

  <!-- Suggested dims callout -->
  <g font-family="sans-serif" font-size="11" fill="#58a6ff">
    <text x="70" y="460">Suggested first pour: ~83 � 53 � 11.53 deep  �  wall hang or desk stand  �  power exit bottom-right</text>
  </g>
</svg>
